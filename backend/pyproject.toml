[project]
name = "snuh-patient-calculator-backend"
version = "0.1.0"
description = "SNUH 환자 정보 기반 수치 계산기 — snuh-fhir 를 소비하는 FastAPI 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
