apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml, service.yaml]
configMapGenerator:
  - name: snuh-patient-calculator-config
    envs: [config.env]
images:
  - name: registry.internal/airgap/snuh-patient-calculator
    newTag: "__TAG__"                   # zip 생성 시 deploy/upload-testbed.sh 가 빌드 태그(YYMMDD + v1, v2…)로 치환. 저장소에는 태그를 커밋하지 않는다
