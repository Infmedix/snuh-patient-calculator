apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml, service.yaml]
configMapGenerator:
  - name: snuh-patient-calculator-config
    envs: [config.env]
images:
  - name: registry.internal/airgap/snuh-patient-calculator
    newTag: "261007v2"                  # 불변 태그 = 빌드 태그(YYMMDD + v1, v2…). 재빌드 시 함께 bump. ":latest" 금지
